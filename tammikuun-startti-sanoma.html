:root{
  --canvas:#F3F1ED; --paper:#FAFAF8; --card:#F7F5F2; --ivory:#F1EEE6;
  --ink:#432F24; --ink2:#2B2520; --warm:#6B6560; --muted:#7A7269; --meta:#8C8377;
  --coral:#DE9B79; --coral-deep:#B9714F; --hair:rgba(67,47,36,.12);
  --health:#A3BCAE; --mind:#B9CDCE; --lifestyle:#E4977C; --social:#F0CBB4; --work:#6786A2; --growth:#F0E1AF;
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"DM Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --bar:42px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#E7E3DC;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
img{max-width:100%}

/* ---------- demo bar ---------- */
.demobar{position:sticky;top:0;z-index:50;background:var(--ink2);color:#EFE9E1;display:flex;align-items:center;gap:6px;padding:0 10px;height:var(--bar);font-size:12.5px}
.demobar .tag{font-weight:600;letter-spacing:.08em;color:var(--coral);margin-right:4px}
.demobar nav{display:flex;flex:1;min-width:0;justify-content:space-between;overflow-x:auto;scrollbar-width:none}
.demobar nav::-webkit-scrollbar{display:none}
.demobar nav button{background:none;border:0;color:#CFC6BA;padding:10px 6px;border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
.demobar nav button[aria-current="page"]{color:#fff;border-bottom-color:var(--coral)}
.devsw{display:none;margin-left:auto;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.devsw button{background:none;border:0;border-radius:999px;color:#CFC6BA;padding:5px 13px;font-weight:500;font-size:12.5px}
.devsw button[aria-pressed="true"]{background:#EFE9E1;color:var(--ink2)}
body[data-wide="1"] .devsw{display:flex}
body[data-wide="1"] .demobar{padding:0 20px;gap:10px}
body[data-wide="1"] .demobar nav{flex:0 1 auto;justify-content:flex-start;gap:8px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--coral-deep);outline-offset:2px}

/* ---------- device frames ---------- */
.chrome{display:none}
.stage{container-type:inline-size;container-name:stage;background:var(--canvas);min-height:calc(100vh - var(--bar))}
body[data-device="native"] .frame{max-width:560px;margin:0 auto}
body[data-device="phone"] .desk{display:flex;justify-content:center;padding:26px 0 36px}
body[data-device="phone"] .frame{width:410px;height:min(864px, calc(100vh - var(--bar) - 62px));border:10px solid #211D1A;border-radius:46px;overflow:hidden;background:#211D1A;box-shadow:0 34px 60px -24px rgba(43,37,32,.45)}
body[data-device="phone"] .stage{height:100%;min-height:0;overflow-y:auto;border-radius:34px;scrollbar-width:none}
body[data-device="phone"] .stage::-webkit-scrollbar{display:none}
body[data-device="desktop"] .desk{padding:22px 24px 48px}
body[data-device="desktop"] .frame{max-width:1280px;margin:0 auto;border-radius:12px;overflow:clip;border:1px solid rgba(67,47,36,.16);box-shadow:0 30px 60px -30px rgba(43,37,32,.35);background:var(--canvas)}
body[data-device="desktop"] .chrome{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;background:#DDD8D0;border-bottom:1px solid rgba(67,47,36,.12)}
.chrome i{width:11px;height:11px;border-radius:50%;background:#BDB6AC;display:block}
.chrome .url{margin-left:14px;flex:1;max-width:520px;background:#F3F1ED;border-radius:999px;padding:4px 14px;font-size:12.5px;color:var(--warm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body[data-device="desktop"] .stage{min-height:72vh}

.overline{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--meta)}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--ink);margin:0;font-variant-numeric:lining-nums}
h1{font-size:31px;line-height:1.16;letter-spacing:-.005em}
h2{font-size:24px;line-height:1.2}
p{margin:0}
.view{display:none}
.view.on{display:block}

/* ---------- email model: neutral structure, no publisher branding ---------- */
.mailwrap{background:#ECEAE6;padding:0 0 36px;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#191919}
.mail{max-width:600px;margin:0 auto;background:#fff}
.mailmeta{padding:14px 18px;border-bottom:1px solid #E6E3DE;font-size:13px;line-height:1.55;background:#FBFAF8}
.mailmeta .draft{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;background:#222;color:#fff;border-radius:4px;padding:2px 7px;margin-bottom:8px}
.mailmeta .subj{font-size:17px;font-weight:700;margin:2px 0 2px;color:#111}
.mailmeta .pre{color:#777}
.mhead{padding:26px 24px 6px;text-align:center}
.mhead .slot{display:inline-block;border:1.5px dashed #B9B4AC;border-radius:6px;color:#8A857D;font-size:12px;letter-spacing:.04em;padding:10px 18px}
.mhead .date{margin-top:14px;font-family:Georgia,"Times New Roman",serif;font-size:14px;letter-spacing:.06em;color:#6C6C6C}
.mtag{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:19px;line-height:1.35;text-align:center;padding:14px 32px 6px;color:#191919}
.mintro{padding:18px 24px 6px;font-size:17px;line-height:1.5}
.mintro p{margin:0 0 12px}
.mart{padding:26px 0 0}
.mart .pic{position:relative;display:block}
.mart .pic img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.mart .pic .slotnote{position:absolute;left:10px;bottom:10px;background:rgba(25,25,25,.72);color:#fff;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;border-radius:3px;padding:3px 7px}
.mart .k{padding:18px 24px 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6C6C6C}
.mart h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:29px;line-height:1.14;color:#191919;padding:6px 24px 0}
.mbtn{display:inline-block;background:#191919;color:#fff;border-radius:28px;padding:14px 28px;font-size:14px;font-weight:700;text-decoration:none}
.mart .go{padding:18px 24px 0}
.mteko{display:flex;gap:14px;align-items:center;margin:20px 24px 0;background:#F3F1ED;border-radius:14px;padding:12px 14px 12px 12px}
.mteko .tile{flex:0 0 64px;height:64px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.mteko .tile img{width:52px;height:52px;object-fit:contain}
.mteko .tk{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A6A55}
.mteko .tn{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.2;margin-top:2px}
.mteko .td{font-size:14.5px;line-height:1.4;color:#4A4A4A;margin-top:3px}
.mtekot{margin:20px 24px 0;background:#F3F1ED;border-radius:14px;padding:16px 16px 18px}
.mtekot .tk{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A6A55;margin-bottom:4px}
.mtekot .trow{position:relative;display:flex;align-items:center;gap:12px;padding:12px 0;text-decoration:none;color:#2B2520}
.mtekot .trow + .trow::before{content:"";position:absolute;left:60px;right:0;top:0;height:1px;background:rgba(67,47,36,.14)}
.mtekot .mini{flex:0 0 48px;width:48px;border-radius:11px;outline:0}
.mtekot .tx{flex:1;min-width:0;display:block}
.mtekot .tn{display:block;font-family:Georgia,"Times New Roman",serif;font-size:18.5px;line-height:1.2;color:#191919;overflow-wrap:break-word;hyphens:manual;-webkit-hyphens:manual}
.mtekot .td{display:block;font-size:14.5px;line-height:1.4;color:#5F5A55;margin-top:3px;overflow-wrap:break-word;hyphens:manual;-webkit-hyphens:manual}
.mtekot .chev{flex:0 0 auto;color:#B9714F;font-size:24px;line-height:1;padding:0 2px 3px 4px}
.mtekot .tcta{display:inline-block;margin-top:10px;font-size:15px;font-weight:700;color:#191919;text-decoration:underline;text-underline-offset:3px}
.mben strong{font-weight:700}
.mrule{height:1px;background:#D6D3CE;margin:28px 24px 0}
.mben{margin:22px 0 0;background:#F3F1ED}
.mben img.band{display:block;width:100%}
.mben .in{padding:8px 24px 30px}
.mben .by{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A6A55}
.mben .by img{width:20px;height:20px}
.mben h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:29px;line-height:1.14;margin:10px 0 12px;color:#191919}
.mben p{font-size:17px;line-height:1.5;margin:0 0 18px}
.mclose{padding:30px 24px 4px;text-align:center}
.mclose p{font-size:15px;color:#555;margin:14px 0 0;line-height:1.45}
.msign{padding:26px 24px 28px;font-size:17px;line-height:1.5}
.mfoot{background:#F4F4F4;padding:18px 24px 22px;font-size:12px;line-height:1.5;color:#777;text-align:center}
.mailnote{max-width:600px;margin:14px auto 0;padding:0 18px;font-size:12.5px;color:#6F6A63;line-height:1.5}

/* ---------- landing ---------- */
.lp header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:600;font-size:18px}
.brand img{width:26px;height:26px}
.pill{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--coral-deep);background:var(--ivory);border:1px solid var(--hair);border-radius:999px;padding:5px 10px}
.hero{padding:18px 20px 0}
.hero h1{margin:8px 0 12px}
.hero .lead{font-size:17px;line-height:1.5;color:var(--warm)}
.hero .fine{margin-top:10px;font-size:13.5px;color:var(--muted)}
.heroimg{display:block;width:100%;height:auto;margin-top:8px}
.steps{list-style:none;margin:4px 20px 0;padding:14px 16px;background:var(--ivory);border-radius:18px;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:baseline;font-size:15px;color:var(--ink)}
.steps .n{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--coral-deep);min-width:14px;font-variant-numeric:lining-nums}
.theme{padding:34px 20px 0;scroll-margin-top:52px}
.theme .head{display:flex;align-items:center;gap:14px}
.theme .thumb{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:0 0 auto}
.theme .timg{display:none}
.article{display:block;margin-top:14px;padding:14px 16px;background:var(--paper);border:1px solid var(--hair);border-radius:16px;text-decoration:none}
.article .src{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--meta)}
.article .ti{font-family:var(--serif);font-size:18px;line-height:1.3;margin:5px 0 8px;color:var(--ink)}
.article .go{font-size:14px;font-weight:500;color:var(--coral-deep)}
.sub{margin:18px 0 10px}
.habits{display:block;margin:0 -10px}
.hrow{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 10px;background:none;border:0;border-radius:14px;text-align:left;color:var(--ink)}
.hrow::after{content:"";position:absolute;left:64px;right:10px;bottom:0;height:1px;background:var(--hair)}
.hrow:last-child::after{display:none}
.hrow:active{opacity:.72}
.mini{flex:0 0 42px;width:42px;aspect-ratio:3/4.08;border-radius:10px;background:var(--cat, var(--ivory));display:flex;align-items:center;justify-content:center;outline:2px solid transparent;outline-offset:2px}
.mini img{width:72%;height:auto}
.hrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hrow .nm{font-family:var(--serif);font-weight:400;font-size:18px;line-height:22px;overflow-wrap:break-word;hyphens:manual;-webkit-hyphens:manual}
.hrow .ds{font-size:15px;line-height:18px;color:var(--warm);overflow-wrap:break-word;hyphens:manual;-webkit-hyphens:manual}
.hrow .tr{flex:0 0 auto;min-width:44px;display:flex;align-items:center;justify-content:flex-end}
.hrow .padd{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--coral-deep)}
.hrow .padd svg{width:18px;height:18px}
.hrow .own{display:none;font-family:var(--serif);font-style:italic;font-size:15px;line-height:16px;color:var(--warm);padding:0 4px 0 6px}
.hrow.sel .padd{display:none}
.hrow.sel .own{display:block}
.hrow.sel .mini{outline-color:var(--coral-deep)}
.face{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:3/4.08;border-radius:20px;background:var(--cat, var(--ivory));outline:3px solid transparent;outline-offset:2px;transition:outline-color .15s, transform .15s, box-shadow .15s}
.face img{width:64%;max-width:124px;height:auto}
.cpill{position:absolute;top:8px;right:8px;background:#fff;color:var(--ink2);font-size:11px;font-weight:600;line-height:1;border-radius:999px;padding:6px 9px 5px;box-shadow:0 1px 2px rgba(67,47,36,.14)}
.hint{font-size:13.5px;color:var(--warm);margin:-4px 0 12px}
.more{margin-top:14px}
.lpfoot{margin:40px 20px 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.demoset{margin:18px 20px 28px;padding:12px 14px;border:1px dashed rgba(67,47,36,.3);border-radius:12px;font-size:13px;color:var(--warm)}
.demoset button{background:none;border:1px solid var(--hair);border-radius:999px;padding:5px 11px;margin:6px 6px 0 0;font-size:13px}
.demoset button[aria-pressed="true"]{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.bar{position:sticky;bottom:0;z-index:20;background:rgba(250,250,248,.96);border-top:1px solid var(--hair);backdrop-filter:blur(8px)}
.bar .in{padding:12px 20px calc(12px + env(safe-area-inset-bottom, 0px));display:flex;align-items:center;gap:14px}
.bar .count{flex:1;font-size:14.5px;color:var(--warm);line-height:1.3}
.bar .count b{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink);font-variant-numeric:lining-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--canvas);font-weight:600;font-size:16px;padding:13px 22px;min-height:48px;text-decoration:none}
.btn.sec{background:transparent;color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:default}
.btn.wide{width:100%}

/* ---------- start (email + consent) ---------- */
.st{padding:22px 20px 60px}
.st h1{margin:8px 0 10px}
.st .lead{color:var(--warm);font-size:16.5px}
.chosen{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:8px}
.chosen li{display:flex;align-items:center;gap:12px;background:var(--cat, var(--card));border-radius:16px;padding:8px 12px 8px 8px}
.chosen .tile{flex:0 0 48px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.chosen .tile img{width:38px;height:38px;object-fit:contain}
.chosen .nm{flex:1;font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.25}
.chosen .nm small{display:block;font-family:var(--sans);font-weight:400;font-size:13px;color:rgba(67,47,36,.8);margin-top:1px}
.chosen button{background:none;border:0;font-size:13.5px;color:var(--ink);text-decoration:underline;padding:8px 4px}
.back{display:inline-block;margin-top:12px;font-size:14.5px;color:var(--coral-deep);background:none;border:0;padding:6px 0;text-decoration:underline}
label.f{display:block;margin-top:26px;font-size:14px;font-weight:600}
input[type=email]{display:block;width:100%;margin-top:7px;font:inherit;font-size:16.5px;color:var(--ink);background:#fff;border:1.5px solid rgba(67,47,36,.22);border-radius:14px;padding:13px 14px}
.help{font-size:13.5px;color:var(--muted);margin-top:7px}
.consent{display:flex;gap:11px;align-items:flex-start;margin-top:18px;font-size:14px;line-height:1.45;color:var(--warm)}
.consent input{width:21px;height:21px;margin:1px 0 0;accent-color:var(--ink);flex:0 0 auto}
.err{color:#A3341F;font-size:14px;margin-top:12px;min-height:1.4em}
.actions{display:grid;gap:10px;margin-top:8px}
.tiny{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.5}
.ok{margin-top:14px;background:var(--ivory);border-radius:16px;padding:14px 16px;font-size:14.5px;color:var(--ink);display:none}
.ok.on{display:block}
.ok ul{margin:6px 0 0;padding-left:18px;color:var(--warm)}

/* ---------- simulated app ---------- */
.app{padding:20px 20px 60px}
.simtag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--ink2);color:#EFE9E1;border-radius:4px;padding:3px 8px}
.app .date{margin-top:18px}
.app h1{margin:4px 0 4px}
.plus{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px 14px;background:var(--ivory);border-radius:14px;font-size:14px;color:var(--ink)}
.plus .dot{width:8px;height:8px;border-radius:50%;background:var(--coral);flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;margin-top:20px}
.hc{min-width:0;display:flex;flex-direction:column}
.hc .nm{display:block;font-size:13.5px;font-weight:500;line-height:1.25;color:var(--ink2);margin-top:8px;overflow-wrap:break-word;hyphens:manual}
.hc .fq{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.hc .wk{display:flex;justify-content:space-between;margin-top:auto;padding-top:7px;font-size:9.5px;font-weight:600;color:var(--meta);padding:0 2px}
.hc .dots{display:flex;justify-content:space-between;margin-top:3px}
.hc .dots i{width:9px;height:6px;border-radius:3px;background:rgba(67,47,36,.09);display:block}
.hc .dots i.pl{background:rgba(67,47,36,.32)}
.note{margin-top:22px;padding:14px 16px;border:1px dashed rgba(67,47,36,.3);border-radius:14px;font-size:14px;line-height:1.5;color:var(--warm)}
.note b{color:var(--ink);font-weight:600}
.door{display:flex;gap:14px;align-items:center;margin-top:22px;background:var(--paper);border:1px solid var(--hair);border-radius:18px;padding:12px 14px}
.door img{width:84px;height:auto;flex:0 0 auto}
.door .t{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.25}
.door .d{font-size:13.5px;color:var(--warm);margin-top:3px}


/* ---------- habit detail sheet ---------- */
.sheetwrap{position:fixed;inset:0;z-index:60}
.sheetwrap[hidden]{display:none}
body[data-device="phone"] .frame{position:relative}
body[data-device="phone"] .sheetwrap{position:absolute}
.scrim{position:absolute;inset:0;background:rgba(43,37,32,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--paper);border-radius:26px 26px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(43,37,32,.25);max-width:560px;margin:0 auto}
.sh-scroll{overflow-y:auto;padding:18px 20px 8px;-webkit-overflow-scrolling:touch}
.sh-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(67,47,36,.08);font-size:20px;line-height:1;color:var(--ink);z-index:2}
.sh-top{display:flex;gap:16px;align-items:flex-start;padding-right:36px}
.sh-top .face{flex:0 0 96px;width:96px;border-radius:18px}
.sh-top h2{font-size:25px;margin:4px 0 6px}
.sh-sub{font-size:15px;line-height:1.45;color:var(--warm)}
.sh-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sh-chips span{font-size:12px;font-weight:600;color:var(--ink2);background:var(--ivory);border:1px solid var(--hair);border-radius:999px;padding:4px 10px}
.sh-desc{margin-top:18px;font-size:15.5px;line-height:1.55;color:var(--ink2)}
.sh-desc p{margin:0 0 12px}
.sh-desc h4{font-family:var(--sans);font-size:14px;font-weight:600;margin:16px 0 8px;color:var(--ink)}
.sh-desc ul{margin:0 0 12px;padding-left:20px}
.sh-desc li{margin:0 0 7px}
.sh-desc.collapsed > :nth-child(n+2){display:none}
.sh-desc.collapsed > :first-child{margin-bottom:6px}
.sh-more{background:none;border:0;padding:2px 0 6px;font-size:14.5px;font-weight:500;color:var(--coral-deep);text-decoration:underline;text-underline-offset:3px}
.sh-sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--hair)}
.sh-ben{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.sh-ben li{display:flex;gap:14px;align-items:baseline}
.sh-ben .n{font-family:var(--serif);font-size:19px;color:var(--coral-deep);min-width:26px;font-variant-numeric:lining-nums}
.sh-ben b{display:block;font-family:var(--serif);font-weight:600;font-size:16.5px;line-height:1.25}
.sh-ben span.t{display:block;font-size:14px;line-height:1.45;color:var(--warm);margin-top:2px}
.sh-freq{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sh-freq button{border:1.5px solid rgba(67,47,36,.25);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:500;color:var(--ink)}
.sh-freq button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
.sh-foot{padding:12px 20px calc(14px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--hair);background:var(--paper);display:grid;gap:6px}
.sh-keep{background:none;border:0;padding:8px;font-size:14.5px;color:var(--warm);text-decoration:underline;text-underline-offset:3px}
.sh-full{font-size:13.5px;color:#A3341F;text-align:center;margin:0}
.endh{font-size:26px;margin:6px 40px 10px 0}
.endp{font-size:16px;line-height:1.5;color:var(--ink2)}
.endl{list-style:none;margin:16px 0 6px;padding:0;border-top:1px solid var(--hair)}
.endl li{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--hair);font-size:15px}
.endl li b{font-family:var(--serif);font-weight:400;font-size:17px}
.endl li span{color:var(--warm);text-align:right}
@media (max-width:359px){.sh-top{gap:12px}.sh-top .face{flex-basis:68px;width:68px;border-radius:14px}.sh-top h2{font-size:21px}.sh-sub{font-size:14px}.sh-scroll{padding:16px 16px 8px}.sh-foot{padding-left:16px;padding-right:16px}}
body[data-device="desktop"] .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(720px, calc(100vw - 48px));max-width:none;max-height:min(86vh, 860px);border-radius:26px}
body[data-device="desktop"] .sh-scroll{padding:30px 34px 12px}
body[data-device="desktop"] .sh-top{gap:26px}
body[data-device="desktop"] .sh-top .face{flex-basis:116px;width:116px;border-radius:20px}
body[data-device="desktop"] .sh-top h2{font-size:32px}
body[data-device="desktop"] .sh-foot{padding:14px 34px 18px;grid-template-columns:1fr auto;align-items:center}
body[data-device="desktop"] .sh-foot .btn{order:2;min-width:220px}
body[data-device="desktop"] .sh-full{grid-column:1 / -1}

@container stage (max-width:359px){
  .cpill{font-size:10px;padding:5px 7px 4px;top:6px;right:6px}.hrow{gap:10px}.hrow .nm{font-size:17px}.hrow .ds{font-size:14px}.hrow .tr{min-width:36px}.hrow .padd{width:36px}h1{font-size:28px}
  .mart h3,.mben h3{font-size:25px}
}

/* ---------- wide layouts (desktop browser / desktop mail client) ---------- */
@container stage (min-width:720px){
  .mailwrap{padding:28px 20px 56px}
  .mail{box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .mart h3,.mben h3{font-size:32px}
  .mtekot{padding:18px 20px 20px}
  .mtekot .mini{flex-basis:52px;width:52px;border-radius:12px}
  .mtekot .trow{gap:16px}
  .mtekot .trow + .trow::before{left:68px}
  .mtekot .td{font-size:15px}
  .mtekot .tn{font-size:20px}

  .lp header{max-width:1160px;margin:0 auto;padding:22px 48px 4px}
  .brand{font-size:21px}.brand img{width:30px;height:30px}
  .herowrap{max-width:1160px;margin:0 auto;padding:30px 48px 10px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:44px;align-items:center}
  .hero{padding:0}
  .hero h1{font-size:52px;line-height:1.08;margin:10px 0 18px}

kkumapaikka.", "freq": "daily"}], "image": "theme-real_rest", "photo": "photo-uni", "photoSource": "https://stocksnap.io/photo/bed-lighting-QCNTAJYHGG"}, {"name": "Ruokarytmi", "article": {"title": "On väliä, mihin kellonaikaan syö", "url": "https://www.hs.fi/elama/art-2000011995149.html"}, "habits": [{"slug": "meal-planning-and-preparation", "id": 2224, "cat": "health", "name": "Aterioiden preppaus", "sub": "Suunnittele ja valmistele aterioita etukäteen tukeaksesi tasapainoista ja ravitsevaa syömistä.", "freq": "few"}, {"slug": "regular-cooking-practice", "id": 2932, "cat": "health", "name": "Säännöllinen ruoanlaitto", "sub": "Suunnittele aterioita ja kokkaa kotona säännöllisesti.", "freq": "few"}, {"slug": "healthy-snack-prepping", "id": 2222, "cat": "health", "name": "Terveellisten välipalojen valmistelu", "sub": "Valmista ja annostele terveellisiä välipaloja etukäteen, jotta voit tehdä terveellisempiä valintoja.", "freq": "daily"}], "image": "theme-healthy_eating", "photo": "photo-ruokarytmi", "photoSource": "https://stocksnap.io/photo/breakfast-fruit-UHZV3F1OZH"}, {"name": "Liike", "article": {"title": "Nousujohteisen treenin kaava", "url": "https://www.hs.fi/elama/art-2000010924542.html"}, "habits": [{"slug": "strength-training", "id": 1290, "cat": "health", "name": "Voimaharjoittelu", "sub": "Vahvista kehoasi ja mieltäsi voimaharjoittelulla.", "freq": "few"}, {"slug": "exercise-of-the-day", "id": 1963, "cat": "health", "name": "Päivän harjoitus", "sub": "Paranna terveyttä ja hyvinvointia päivittäisellä liikkumisella.", "freq": "daily"}, {"slug": "stretching", "id": 48922, "cat": "health", "name": "Venyttely", "sub": "Venyttele 5–10 minuuttia päivässä ja liitä tapa johonkin toistuvaan hetkeen.", "freq": "daily"}], "image": "theme-movement", "photo": "photo-liike", "photoSource": "https://stocksnap.io/photo/weights-fitness-3H89EH3WIJ"}], "hyphenation": {"Nukkumaanmenorutiini": "Nukkumaan­meno­rutiini", "nukkumaanmenorutiini": "nukkumaan­meno­rutiini", "rauhoittumisaika": "rauhoittumis­aika", "nukkumisympäristö": "nukkumis­ympäristö", "välipalojen": "väli­palojen", "Voimaharjoittelu": "Voima­harjoittelu", "voimaharjoittelulla": "voima­harjoittelulla", "ruoanlaitto": "ruoan­laitto", "rentoutumishetkiä": "rentoutumis­hetkiä", "heräämisajasta": "heräämis­ajasta", "nukkumisasetuksia": "nukkumis­asetuksia"}, "categories": {"health": "Terveys", "mind": "Mieli", "lifestyle": "Elämäntapa", "social": "Ihmissuhteet", "work": "Työ", "growth": "Kasvu"}, "details": {"relaxation-breaks": {"paras": ["Pidä päivän aikana lyhyitä taukoja, jotka on omistettu palautumiselle ja irrottautumiselle työstä tai muista kuormittavista asioista. Käytäntö perustuu ajatukseen, että säännölliset tauot ovat välttämättömiä henkisen ja fyysisen hyvinvoinnin tukemisessa, erityisesti nykypäivän nopeatempoisessa arjessa.", "Vinkkejä:", "• Aikatauluta päivän mittaan lyhyitä, 5–30 minuutin taukoja.", "• Kohtele taukoja tärkeinä ja keskeytymättöminä hetkinä.", "• Valitse sinulle mieluisia tapoja rentoutua: kävely, musiikki, lukeminen tai rauhallinen hengittely.", "• Vältä työntekoa ja teknologiaa taukojen aikana, jotta voit palautua kunnolla.", "• Huomioi vaikutukset: seuraa, miten tauot vaikuttavat stressiin, keskittymiseen ja jaksamiseen."], "benefits": [{"title": "Parantaa henkistä hyvinvointia", "text": "Suunnitelmallinen rentoutumisaika voi parantaa yleistä mielenterveyttä, mikä lisää onnellisuutta, vähentää ahdistusta ja myönteisempiä näkymiä."}, {"title": "Lisää tuottavuutta", "text": "Intuition vastaisesti lyhyiden taukojen pitäminen voi itse asiassa lisätä tuottavuutta estämällä työuupumusta ja ylläpitämällä keskittymis- ja energiatasoa."}, {"title": "Vähentää stressiä", "text": "Säännölliset tauot auttavat alentamaan stressitasoja tarjoamalla henkistä lepoa ja vähentämällä stressin kertymistä päivän aikana."}], "context": "Työpäivän aikana"}, "daily-scheduled-downtime": {"paras": ["Varaa itsellesi joka päivä tietty aika, jolloin voit tietoisesti irrottautua päivittäisten häiriötekijöiden ja velvollisuuksien pyörteestä ja varata hetkiä yksinäisyydelle ja syvälliselle pohdinnalle. Tämä \"ajastettu hiljaisuus\" on tilaisuutesi vetäytyä tilaan, jossa voit pohtia prioriteettejasi, arvojasi ja tavoitteitasi ilman arjen melua. Tämä hiljaisuus ja erillisyys mahdollistavat hienovaraisemman ymmärryksen sen välillä, mikä elämässäsi on aidosti tärkeää ja mikä vain tuntuu kiireelliseltä."], "benefits": [{"title": "Parempi elämänlaatu", "text": "Tämä tapa auttaa saamaan päivittäiseen rutiiniin \"omaa aikaa\", parantamaan yleistä elämänlaatua ja tuomaan iloa arkeen."}, {"title": "Psyykkinen kestävyys ja hyvinvointi", "text": "Säännölliset yksinäisyysjaksot ravitsevat mielentilaasi, tarjoavat kaivattua taukoa kaaoksesta ja edistävät joustavuutta ja hyvinvointia."}, {"title": "Vahvistaa päätöksentekoa", "text": "Tämä päivittäinen tapa terävöittää arvostelukykyäsi ja auttaa sinua erottamaan todelliset prioriteetit pelkistä kiireistä."}], "context": "Milloin vain"}, "scheduled-unplugging": {"paras": ["Ruutuvapaa aika auttaa luomaan säännöllisiä ja tietoisia taukoja laitteiden käytöstä. Tavoitteena ei ole vain vähentää ruutuaikaa, vaan palauttaa keskittymiskykyä, keventää mieltä ja vahvistaa yhteyttä ympäröivään maailmaan.", "Tässä tavassa valitset selkeät hetket, jolloin jätät puhelimet, tietokoneet ja muut ruudut sivuun. Se voi olla tunti illalla, laitteeton ruokailuhetki tai viikoittainen pidempi offline-aika. Näiden hetkien tarkoitus on antaa tilaa asioille, jotka tuovat läsnäoloa: lukemiselle, ulkoilulle, harrastuksille tai kiireettömälle yhdessäololle.", "Tavan juurtuminen helpottuu, kun suunnittelet ruutuvapaat ajat etukäteen ja asetat selkeät rajat ruutujen käytölle. Samalla on tärkeää valita itselle mieluisia, rauhoittavia tai innostavia offline-tekemisiä, jotta hetket tuntuvat vapailta eivätkä rajoittavilta.", "Ajan myötä ruutuvapaa aika auttaa rakentamaan tasapainoisemman suhteen teknologiaan — niin, että ruudut ovat käytössä silloin kun niille on tarkoitus, ja ruuduttomat hetket tuovat selkeyttä, rauhaa ja läsnäoloa."], "benefits": [{"title": "Paremmat suhteet", "text": "Kannustaa syvempään ja sitoutuneempaan vuorovaikutukseen muiden kanssa."}, {"title": "Parempi keskittyminen", "text": "Parantaa keskittymistä ja tuottavuutta vähentämällä häiriötekijöitä."}, {"title": "Vähentynyt stressi", "text": "Minimoi digitaalisen ylikuormituksen ja henkisen väsymyksen."}], "context": "Illalla"}, "consistent-sleep-schedule": {"paras": ["Pidä kiinni samasta heräämisajasta — myös viikonloppuisin — jotta kehon luonnollinen unirytmi pysyy tasaisena.", "Yksi tehokkaimmista tavoista parantaa unen laatua on noudattaa johdonmukaista unirytmiä. Kun menet nukkumaan ja heräät samaan aikaan päivittäin, kehon sisäinen kello pysyy tasapainossa. Tämä helpottaa nukahtamista, vähentää yöllistä heräilyä ja tekee heräämisestä luonnollisempaa ja virkeämpää.", "Valitse heräämisaika, joka sopii arkeesi, ja laske siitä 7–9 tuntia taaksepäin löytääksesi sopivan nukkumaanmenoajan. Voit tukea rutiinia laittamalla muistutuksen illan rauhoittumiselle — himmennä valot, hiljennä tahti ja valmistaudu uneen.", "Kun pidät unirytmin tasaisena myös viikonloppuisin, energia, mieliala ja unen palauttavuus paranevat vähitellen päivä päivältä."], "benefits": [{"title": "Pitkäaikainen terveys", "text": "Tukee sydän- ja verisuoniterveyttä, aineenvaihduntaa ja kognitiivisia toimintoja."}, {"title": "Parannetut energiatasot", "text": "Vähentää väsymystä ja lisää päivävireyttä."}, {"title": "Parempi unen laatu", "text": "Helpompi nukahtaa ja herätä luonnollisesti."}], "context": "Aamulla ja illalla"}, "bedtime-routine": {"paras": ["Rentouttavan nukkumaanmenorutiinin luominen on tehokas tapa viestiä kehollesi, että on aika siirtyä päivän aktiviteeteista lepoon. Rutiinin tulisi alkaa 30-60 minuuttia ennen aiottua nukkumaanmenoaikaa, ja siihen tulisi sisältyä rauhoittavia toimintoja, jotka koet henkilökohtaisesti rentouttaviksi.", "Kirjan lukeminen, lämmin kylpy tai rentoutustekniikat, kuten syvään hengittäminen, meditaatio tai lempeä jooga, voivat tehokkaasti rentouttaa mielen ja kehon univalmiuteen. Nämä toiminnot auttavat alentamaan sykettä, vähentämään stressiä ja laskemaan kehon lämpötilaa, jotka ovat keskeisiä fysiologisia reaktioita, jotka valmistavat kehoa uneen.", "Tämän rutiinin vakiinnuttaminen yölliseksi tavaksi luo psykologisen ja fysiologisen signaalin nukkumisesta, mikä parantaa sekä nukahtamisen nopeutta että itse unen laatua."], "benefits": [{"title": "Parannettu rentoutuminen ja stressin vähentäminen", "text": "Lukemisen tai meditaation kaltaiset toiminnot alentavat stressitasoja ja saavat aikaan rentoutumista."}, {"title": "Nukahtamiseen kuluva aika lyhenee", "text": "Johdonmukaiset nukkumaanmenorutiinit lyhentävät nukahtamisaikaa, koska ne valmistavat kehoa uneen."}, {"title": "Parempi unen laatu", "text": "Rauhoittava nukkumaanmenorutiini edistää syvempää, palauttavaa unta."}], "context": "Illalla"}, "optimize-sleep-environment": {"paras": ["Jotta makuuhuoneestasi tulisi levollisten unien tyyssija, on tärkeää toteuttaa joka yö erityisiä, toteuttamiskelpoisia toimia.", "Lämpötila rauhoittaa:\nAloita laskemalla makuuhuoneen lämpötila viileään ja miellyttävään noin 16–19 asteeseen. Tämä jäljittelee kehosi luonnollista lämpötilan laskua unen aikana, mikä parantaa unen laatua.", "Pimeydellä on väliä:\nHimmennä tai sammuta kaikki valot pimeyden edistämiseksi. Tämä viestii aivoille, että on aika nukkua, ja tehostaa melatoniinin tuotantoa, joka on uni-valverytmiä säätelevä hormoni.  Käytä tarvittaessa pimennysverhoja ulkoisten valonlähteiden estämiseksi.", "Hiljaisuus on kultaa:\nMinimoi meluhäiriöt käyttämällä korvatulppia tai valkoisen kohinan soittokonetta, joka luo tasaisen, rauhoittavan ääniympäristön. Tämä voi peittää häiritsevät äänet ja auttaa sinua nukahtamaan ja pysymään unessa.", "Ota tavaksi tarkistaa nämä ympäristötekijät joka ilta: säädä termostaatti, varmista, että valot ovat himmeät tai pois päältä, ja varmista, että nukkumapaikkasi on mahdollisimman hiljainen ja mukava ennen nukkumaanmenoa. Nämä toimet voivat johdonmukaisesti toteutettuina muuttaa unikokemuksesi perusteellisesti."], "benefits": [{"title": "Parantaa mielialaa ja valppautta", "text": "Parempi uni parantaa mielialaa ja vireystilaa päivällä ja vähentää uneliaisuutta ja kognitiivisia ongelmia."}, {"title": "Parempi unen laatu", "text": "Optimaalinen nukkumisympäristö tukee keskeytymätöntä, palauttavaa unta."}, {"title": "Nopeampi unen alkaminen", "text": "Pimeä, hiljainen ja viileä ympäristö lyhentää nukahtamisaikaa."}], "context": "Illalla kotona"}, "meal-planning-and-preparation": {"paras": ["Aterioiden suunnittelun ja valmistuksen sisällyttäminen rutiineihisi on tehokas strategia, jolla voit varmistaa, että syöt tasapainoisia ja ravitsevia aterioita. Varaa aikaa aterioiden suunnitteluun, laadi yksityiskohtainen ostoslista ja valmista mahdollisimman monta ainesosaa etukäteen.", "Tämä jäsennelty lähestymistapa ei ainoastaan tehosta ruoanlaittoa, vaan se myös vähentää houkutusta turvautua valmisruokiin tai pikaruokavaihtoehtoihin aikapulan tai ainesosien puutteen vuoksi. Suunnittelemalla etukäteen voit varmistaa ruokavalion monipuolisuuden, hallita annoskokoja ja keskittyä tuoreisiin, terveellisiin ainesosiin."], "benefits": [{"title": "Kustannustehokkuus", "text": "Vähentää riippuvuutta usein kalliimmista valmisruoista."}, {"title": "Terveellinen ravitsemus", "text": "Helpottaa erilaisten ravintoaineiden sisällyttämistä ruokavalioon."}], "context": "Milloin vain"}, "regular-cooking-practice": {"paras": ["Ruoanlaiton tekeminen säännölliseksi osaksi rutiinia edellyttää ateriasuunnittelua ja aikaa kotona kokkaamiseen.", "Aloita suunnittelemalla ateriat muutamaksi päiväksi eteenpäin tai jopa koko viikoksi. Keskity käyttämään erilaisia makuja ja ravitsevia ainesosia ja ehkäpä kokeilemaan uutta reseptiä tai ruoanlaittomenetelmää.", "Kun valmistat kutakin ateriaa, tutustu erilaisiin kulinaarisiin tekniikoihin ja mausteisiin. Ruokailun jälkeen mieti hetki aterian makuja ja tunnista onnistumiset ja parantamisen kohteet. Kirjoita muistiin oppimasi asiat. Kirjoita muistiinpanosi ruoanlaittovihkoon tai tämän sovelluksen Muistiinpanot-osiossa. Tämä lähestymistapa ei ainoastaan kehitä ruoanlaittotaitojasi, vaan myös muuttaa aterian valmistuksen rikastuttavaksi kokemukseksi."], "benefits": [{"title": "Paremmat ruoanlaittotaidot", "text": "Säännöllinen harjoittelu parantaa kulinaarisia taitoja ja laajentaa reseptitietämystä."}, {"title": "Kustannustehokkuus", "text": "Kotiruokailu säästää rahaa verrattuna ulkona syömiseen tai valmiiden aterioiden ostamiseen."}, {"title": "Terveellisempi syöminen", "text": "Kotona kokkaaminen mahdollistaa ainesosien ja annosten hallinnan, mikä edistää terveellisempiä ruokailutottumuksia."}], "context": "Kotona"}, "healthy-snack-prepping": {"paras": ["Pieni aika terveellisten välipalojen valmisteluun ja annosteluun viikon tai päivän alussa voi vaikuttaa merkittävästi välipalatottumuksiisi. Valitse ravitsevia vaihtoehtoja, kuten leikattuja vihanneksia, hedelmiä, pähkinöitä ja täysjyväviljaa, ja jaa ne yksittäisiin annoksiin.", "Säilytä nämä välipalat näkyvissä, helposti saatavilla olevissa paikoissa kotona tai työtilassa, kuten jääkaapin etuosassa tai työtasolla. Tämä tapa varmistaa, että kun nälkä yllättää, tartut todennäköisemmin johonkin terveydellesi hyödylliseen välipalaan kuin käteviin, runsaskalorisiin vaihtoehtoihin."], "benefits": [{"title": "Rakentaa suunnittelurytmiä", "text": "Pieni valmistautuminen vähentää turvautumista helppoihin epäterveellisiin valintoihin."}, {"title": "Tukee ravitsemusta", "text": "Hedelmistä, vihanneksista, pähkinöistä ja täysjyvistä tulee helpompia oletuksia."}, {"title": "Ehkäisee impulsiivista napostelua", "text": "Valmiit vaihtoehdot ovat saatavilla heti nälän ilmaantuessa."}], "context": "Kotona"}, "strength-training": {"paras": ["Sisällytä voimaharjoittelu säännölliseen kuntorutiiniin, niin saat merkittäviä terveyshyötyjä. Tähän tapaan kuuluu harjoituksia, joissa käytetään painoja, kuten käsipainoja, tankoja tai omaa kehonpainoa, lihasten vahvistamiseksi ja kiinteyttämiseksi. Tärkeintä on johdonmukaisuus ja eteneminen: aloita painoilla, jotka ovat haastavia mutta hallittavissa, ja lisää intensiteettiä vähitellen, kun voimasi paranevat.", "Voimaharjoittelulla on useita terveyshyötyjä: se lisää luuntiheyttä, tehostaa aineenvaihduntaa ja parantaa ryhtiä ja tasapainoa. Sillä on myös ratkaiseva rooli rasvanpudotuksessa, sillä se lisää lihasmassaa, joka polttaa levossa enemmän kaloreita kuin rasva. Fyysisten hyötyjen lisäksi voimaharjoittelu voi parantaa mielenterveyttä, sillä se tarjoaa onnistumisen ja kestävyyden tunteen. Sisällytä se rutiineihisi vähintään kahdesta kolmeen kertaa viikossa optimaalisten tulosten saavuttamiseksi."], "benefits": [{"title": "Parantunut luuntiheys", "text": "Säännölliset painoa kantavat harjoitukset vahvistavat luita ja vähentävät osteoporoosin riskiä."}, {"title": "Tehostettu aineenvaihdunta", "text": "Lihasmassa polttaa enemmän kaloreita levossa, mikä auttaa painonhallinnassa."}, {"title": "Lisääntynyt lihasvoima", "text": "Rakentaa ja kiinteyttää lihaksia ja parantaa yleistä fyysistä voimaa."}], "context": "Milloin vain"}, "exercise-of-the-day": {"paras": ["Paranna terveyttä ja hyvinvointia tuomalla liikunta osaksi päivääsi. Valitse mielialaasi ja aikatauluusi sopiva tapa liikkua — esimerkiksi kuntosalitreeni, reipas kävely luonnossa, rauhoittava jooga tai energisoiva tanssitunti. Aloita lyhyillä harjoitusjaksoilla ja lisää kestoa vähitellen, kun kunto nousee. Tärkeintä on johdonmukaisuus ja oma hyvä olo.", "Säännöllinen liikunta tuo paljon hyötyjä: se vähentää kroonisten sairauksien riskiä, tukee painonhallintaa ja vilkastuttaa aineenvaihduntaa. Se myös vahvistaa henkistä hyvinvointia kohentamalla mielialaa, lievittämällä stressiä sekä terävöittämällä keskittymistä. Etsi itsellesi tapa liikkua, josta oikeasti nautit — liikkumisen tulisi olla virkistävää ja innostavaa."], "benefits": [{"title": "Unen laatu", "text": "Fyysinen aktiivisuus parantaa unen syvyyttä ja levollisuutta."}, {"title": "Fyysinen terveys", "text": "Päivittäinen liikunta tukee sydämen, lihasten ja luuston terveyttä."}, {"title": "Mielenterveys", "text": "Liikunta parantaa mielialaa luonnollisesti."}], "context": "Milloin vain"}, "stretching": {"paras": ["Keskity lempeisiin venytyksiin, jotka kohdistuvat suuriin lihasryhmiin, kuten takareisiin, lonkkiin, selkään ja hartioihin. Pidä kutakin venytystä 20–30 sekuntia ilman pakottamista. Säännöllinen venyttely voi ajan myötä lisätä liikkuvuutta ja nivelten liikerataa, jolloin arjen liikkuminen tuntuu helpommalta ja luonnollisemmalta.", "Venyttely voi helpottaa jäykkyyttä erityisesti pitkän istumisen tai fyysisen rasituksen jälkeen. Se voi tukea ryhtiä ja kehotietoisuutta auttamalla kehoa liikkumaan ilman turhaa kireyttä.", "Lempeästi tehtynä venyttely voi tuntua myös palauttavalta. Se voi helpottaa lihaskireyttä, tukea verenkiertoa ja auttaa kehoa palautumaan liikunnan tai pitkän päivän jälkeen. Samalla se luo luontevan hetken hidastaa. Kun yhdistät venyttelyyn rauhallisen hengityksen, se auttaa rentoutumaan, päästämään irti stressistä ja valmistautumaan lepoon.", "Jos olet menossa tekemään intensiivistä liikuntaa, dynaaminen venyttely on usein parempi valinta ennen suoritusta. Pidemmät staattiset venytykset sopivat yleensä paremmin liikunnan jälkeen tai rauhallisiin hetkiin.", "Käytitpä venyttelyä päivän käynnistämiseen, istumisen tauottamiseen tai iltaan rauhoittumiseen, se on yksinkertainen tapa pitää huolta kehostasi. Pienet, toistuvat liikkuvuuden hetket tukevat hyvää oloa, sujuvampaa liikkumista ja pitkäjänteistä hyvinvointia.", "Vinkit", "• Liitä päivittäiseen rutiiniin: Ankkuroi venyttely aina samaan hetkeen, kuten heräämiseen, lounaaseen tai liikunnan jälkeiseen aikaan.", "•Käytä ajastinta tai lyhyttä videota: Yksinkertainen ajastin tai ohjattu video voi helpottaa keskittymistä ja tehdä tavan toistamisesta helpompaa.", "• Hengitä rauhallisesti: Tasainen hengitys auttaa rentoutumaan venytykseen ilman pakottamista.", "• Aloita kevyellä liikkeellä: Lyhyt kävely tai muutama käsien pyöritys lämmittää kehoa ennen pidempiä staattisia venytyksiä.", "• Venytä molemmat puolet tasaisesti: Se tukee tasapainoa ja auttaa välttämään uusien kireyksien syntymistä.", "•Kuuntele kehoasi: Keskity kohtiin, jotka tuntuvat kireiltä, mutta älä venytä kipuun asti.", "•Tee tavasta näkyvä: Pidä lähelläsi yksinkertainen ohje tai muistilista, jotta tapa on helpompi muistaa.", "• Käytä apuvälineitä tarvittaessa: Pyyhe tai venyttelyhihna voi helpottaa joidenkin asentojen tekemistä mukavammin."], "benefits": [{"title": "Luo rauhaa", "text": "Tarjoaa yksinkertaisen hetken hidastaa, hengittää ja päästää irti stressistä."}, {"title": "Tukee palautumista", "text": "Voi auttaa kehoa tuntumaan rennommalta ja palautuneemmalta tekemisen jälkeen."}, {"title": "Vähentää jäykkyyttä", "text": "Voi helpottaa istumisesta, liikunnasta tai arjen kuormituksesta syntyvää kireyttä."}], "context": ""}}, "demoTextFixes": [["optimize-sleep-environment", "15,6-19,4 celsiusasteeseen (60-67 celsiusastetta)", "noin 16–19 asteeseen"], ["meal-planning-and-preparation", "hyöty: Painonhallinta", "jätetty pois"], ["healthy-snack-prepping", "viimeinen kappale (painonhallinta)", "jätetty pois"]], "frequencies": {"daily": {"label": "Joka päivä"}, "weekdays": {"label": "Arkipäivisin", "byday": "MO,TU,WE,TH,FR", "days": [1, 2, 3, 4, 5]}, "few": {"label": "Muutamana päivänä viikossa", "byday": "MO,WE,FR", "days": [1, 3, 5]}}, "views": ["viesti-a", "viesti-b", "sivu"], "start": "viesti-a", "hideOrderSwitch": true};

const CATNAME = CONFIG.categories || {};
const MAX = CONFIG.maxChoices;
const state = {selected: [], freq: {}, open: null, order: CONFIG.order, pref: "desktop"};
const $ = (s, r) => (r || document).querySelector(s);

function renderMail(variant){
  const B = variant === "b";
  const p = CONFIG.partner, m = CONFIG.mail;
  const arts = CONFIG.themes.map((t, i) => {
    const h = t.habits[0];
    return `<div class="mart">
      <a class="pic" href="${esc(t.article.url)}" target="_blank" rel="noopener"><img src="${IMAGES[t.photo] || IMAGES[t.image]}" alt=""></a>
      <div class="k">${esc(t.name)}</div>
      <h3>${esc(t.article.title)}</h3>
      <div class="go"><a class="mbtn" href="${esc(t.article.url)}" target="_blank" rel="noopener">Lue juttu</a></div>
      ${B ? `<div class="mtekot"><div class="tk">${esc(m.tekoLabel)}</div>
        ${t.habits.map(x => `<a class="trow" href="#sivu" data-theme="${i}" data-pick="${esc(x.slug)}"><span class="mini" style="--cat:${CAT[x.cat]}"><img src="${IMAGES[x.slug]}" alt=""></span><span class="tx"><span class="tn">${hy(x.name)}</span><span class="td">${hy(x.sub)}</span></span><span class="chev" aria-hidden="true">›</span></a>`).join("")}
        <a class="tcta" href="#sivu" data-theme="${i}">${esc(m.tekoCta)}</a></div>` : ""}
      ${i < CONFIG.themes.length - 1 ? '<div class="mrule"></div>' : ""}
    </div>`;
  }).join("");
  return `<div class="mailwrap">
    <div class="mail">
      <div class="mailmeta">
        <span class="draft">LUONNOS · RYHMÄ ${B ? "B" : "A"}</span>
        <div><b>Lähettäjä:</b> ${esc(p.name)}</div>
        <div class="subj">${esc(m.subject)}</div>
        <div class="pre">${esc(m.preheader)}</div>
      </div>
      <div class="mhead"><span class="slot">${esc(m.headerSlot)}</span><div class="date">${esc(m.date)}</div></div>
      <p class="mtag">${esc(m.tagline)}</p>
      <div class="mintro"><p>Hei [etunimi],</p><p>${esc(m.intro)}${B ? " " + esc(m.introB) : ""}</p></div>
      ${B ? `<div class="mben">
        <img class="band" src="${IMAGES.hero}" alt="">
        <div class="in">
          <div class="by"><img src="${IMAGES.icon}" alt="">${esc(m.benefitBy)}</div>
          <h3>${esc(m.benefitTitle)}</h3>
          <p>${md(m.benefitText)}</p>
          <a class="mbtn" href="#sivu">Aloita startti</a>
        </div>
      </div>` : ""}
      ${arts}
      ${B ? `<div class="mclose"><a class="mbtn" href="#sivu">Valitse tekosi ja aloita</a><p>${esc(m.about)}</p></div>` : ""}
      <div class="msign">${esc(m.signoff)}<br>${esc(p.name)}</div>
      <div class="mfoot">${esc(m.footer)}</div>
    </div>
    <p class="mailnote">${esc(m.note)}</p>
  </div>`;
}

const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
function habitCard(h){
  const on = state.selected.includes(h.slug);
  return `<button class="hrow${on ? " sel" : ""}" type="button" data-h="${esc(h.slug)}" data-open="${esc(h.slug)}">
    <span class="mini" style="--cat:${CAT[h.cat] || "var(--ivory)"}"><img src="${IMAGES[h.slug] || ""}" alt=""></span>
    <span class="tx"><span class="nm">${hy(h.name)}</span><span class="ds">${hy(h.sub)}</span></span>
    <span class="tr"><span class="padd">${PLUS}</span><span class="own">${esc(CONFIG.copy.rowOwned)}</span></span>
  </button>`;
}
function articleCard(t, label){
  return `<a class="article" href="${esc(t.article.url)}" target="_blank" rel="noopener">
    <span class="src">${esc(label)}</span>
    <div class="ti">${esc(t.article.title)}</div>
    <span class="go">Lue juttu ↗</span>
  </a>`;
}
function barText(){
  const n = state.selected.length;
  return n === 0 ? "Valitse 1–" + MAX + " tekoa"
    : `<b>${n}/${MAX}</b> valittu` + (n === MAX ? "<br>Vaihda poistamalla ensin yksi valinta." : "");
}
function renderLanding(){
  const p = CONFIG.partner, c = CONFIG.copy;
  const habitsFirst = state.order === "habits-first";
  const themes = CONFIG.themes.map((t, ti) => {
    const art = articleCard(t, habitsFirst ? "Lue lisää · " + p.name : p.name);
    return `<section class="theme">
      <div class="side">
        <img class="timg" src="${IMAGES[t.image]}" alt="">
        <div class="head"><img class="thumb" src="${IMAGES[t.image]}" alt=""><h2>${esc(t.name)}</h2></div>
        ${habitsFirst ? "" : art}
      </div>
      <div class="main">
        <div class="overline sub">${esc(c.habitsLabel)}</div>
        ${ti === 0 ? `<p class="hint">${esc(c.habitsHint)}</p>` : ""}
        <div class="habits">${t.habits.map(habitCard).join("")}</div>
        ${habitsFirst ? `<div class="more">${art}</div>` : ""}
      </div>
    </section>`;
  }).join("");
  return `<div class="lp">
    <header>
      <div class="brand"><img src="${IMAGES.icon}" alt="">Nanohabits</div>
      <span class="pill">${esc(p.pill)}</span>
    </header>
    <div class="herowrap">
      <div class="hero">
        <div class="overline">${esc(c.heroOverline)}</div>
        <h1>${esc(c.h1)}</h1>
        <p class="lead">${esc(c.lead)}</p>
        <p class="fine">${esc(c.fine)}</p>
      </div>
      <img class="heroimg" src="${IMAGES.hero}" alt="">
    </div>
    <ol class="steps">${c.steps.map((s, i) => `<li><span class="n">${i + 1}</span><span>${esc(s)}</span></li>`).join("")}</ol>
    ${themes}
    <p class="lpfoot">${esc(c.foot)}</p>
    ${CONFIG.hideOrderSwitch ? '<div style="height:28px"></div>' : `<div class="demoset">Demon asetus: sama sivupohja kahdella järjestyksellä.<br>
      <button type="button" data-order="articles-first" aria-pressed="${!habitsFirst}">Jutut ensin (kumppani)</button>
      <button type="button" data-order="habits-first" aria-pressed="${habitsFirst}">Teot ensin (yleinen)</button>
    </div>`}
    <div class="bar"><div class="in">
      <div class="count" id="count">${barText()}</div>
      <button class="btn" type="button" id="next" ${VIEWS.includes("aloita") ? 'data-go="aloita"' : 'data-end="1"'} ${state.selected.length ? "" : "disabled"}>Jatka</button>
    </div></div>
  </div>`;
}
function updateBar(){ const c = $("#count"); if (!c) return; c.innerHTML = barText(); $("#next").disabled = state.selected.length === 0; }
function syncCards(){
  document.querySelectorAll(".hrow").forEach(c => c.classList.toggle("sel", state.selected.includes(c.dataset.h)));
  updateBar();
}
function toggle(slug){
  const i = state.selected.indexOf(slug);
  if (i >= 0) state.selected.splice(i, 1);
  else if (state.selected.length < MAX) state.selected.push(slug);
  else { const c = $("#count"); if (c) { c.style.color = "#A3341F"; setTimeout(() => c.style.color = "", 900); } return false; }
  syncCards();
  return true;
}

/* ---------- habit detail sheet ---------- */
const FREQ = CONFIG.frequencies;
const freqOf = slug => state.freq[slug] || habit(slug).freq || "daily";
function descHtml(paras){
  let out = "", list = [];
  const flush = () => { if (list.length) { out += "<ul>" + list.map(l => "<li>" + hy(l) + "</li>").join("") + "</ul>"; list = []; } };
  paras.forEach(p => {
    const t = p.trim();
    if (/^[•\-–]\s*/.test(t) && t.length > 2) { list.push(t.replace(/^[•\-–]\s*/, "")); return; }
    flush();
    const nl = t.indexOf("\n");
    if (nl > 0 && t.slice(0, nl).trim().endsWith(":")) out += "<p><b>" + hy(t.slice(0, nl).trim()) + "</b><br>" + hy(t.slice(nl + 1).trim()) + "</p>";
    else if (t.length < 40 && !/[.!?]$/.test(t)) out += "<h4>" + hy(t.replace(/:$/, "")) + "</h4>";
    else out += "<p>" + hy(t).replace(/\n/g, "<br>") + "</p>";
  });
  flush();
  return out;
}
function sheetHtml(slug){
  const h = habit(slug), d = (CONFIG.details || {})[slug] || {paras: [], benefits: []}, c = CONFIG.copy;
  const on = state.selected.includes(slug), full = !on && state.selected.length >= MAX, fq = freqOf(slug);
  const chips = [CATNAME[h.cat], d.context].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("");
  const many = d.paras.length > 1;
  return `<div class="scrim" data-close="1"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <button class="sh-x" type="button" data-close="1" aria-label="Sulje">×</button>
    <div class="sh-scroll">
      <div class="sh-top">
        <span class="face" style="--cat:${CAT[h.cat]}"><img src="${IMAGES[slug]}" alt=""></span>
        <div>
          <div class="overline">${esc(c.sheetOverline)}</div>
          <h2 id="sh-t">${hy(h.name)}</h2>
          <p class="sh-sub">${hy(h.sub)}</p>
          <div class="sh-chips">${chips}</div>
        </div>
      </div>
      <div class="sh-desc${many ? " collapsed" : ""}" id="sh-desc">${descHtml(d.paras)}</div>
      ${many ? `<button class="sh-more" type="button" data-more="1">${esc(c.sheetMore)}</button>` : ""}
      <div class="sh-sec"><div class="overline">${esc(c.sheetFreq)}</div>
        <div class="sh-freq">${Object.keys(FREQ).map(k => `<button type="button" data-freq="${k}" aria-pressed="${k === fq}">${esc(FREQ[k].label)}</button>`).join("")}</div></div>
      ${d.benefits.length ? `<div class="sh-sec"><div class="overline">${esc(c.sheetBenefits)}</div>
        <ol class="sh-ben">${d.benefits.map((b, i) => `<li><span class="n">0${i + 1}</span><div><b>${esc(b.title)}</b><span class="t">${esc(b.text)}</span></div></li>`).join("")}</ol></div>` : ""}
    </div>
    <div class="sh-foot">
      <button class="btn wide" type="button" data-add="${esc(slug)}" ${full ? "disabled" : ""}>${esc(on ? c.sheetRemove : c.sheetAdd)}</button>
      <button class="sh-keep" type="button" data-close="1">${esc(c.sheetKeep)}</button>
      ${full ? `<p class="sh-full">${esc(c.sheetFull)}</p>` : ""}
    </div>
  </div>`;
}
function openSheet(slug){
  const w = $("#sheet"); state.open = slug; state.opener = document.activeElement;
  w.innerHTML = sheetHtml(slug); w.hidden = false;
  document.documentElement.style.overflow = "hidden"; stage.style.overflowY = document.body.dataset.device === "phone" ? "hidden" : "";
  const x = w.querySelector(".sh-x"); if (x) x.focus();
}
function closeSheet(){
  const w = $("#sheet"); if (!w || w.hidden) return;
  w.hidden = true; w.innerHTML = ""; state.open = null;
  document.documentElement.style.overflow = ""; stage.style.overflowY = "";
  if (state.opener && state.opener.focus) state.opener.focus();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
/* three-view version: the flow ends on the landing page */
function openEnd(){
  const w = $("#sheet"), c = CONFIG.copy; state.open = null; state.opener = document.activeElement;
  const items = state.selected.map(s => `<li><b>${esc(habit(s).name)}</b><span>${esc(FREQ[freqOf(s)].label)}</span></li>`).join("");
  w.innerHTML = `<div class="scrim" data-close="1"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <button class="sh-x" type="button" data-close="1" aria-label="Sulje">×</button>
    <div class="sh-scroll"><div class="overline">${esc(c.endOverline)}</div><h2 id="sh-t" class="endh">${esc(c.endTitle)}</h2><p class="endp">${esc(c.endText)}</p><ul class="endl">${items}</ul></div>
    <div class="sh-foot"><button class="btn wide" type="button" data-close="1">${esc(c.endClose)}</button></div>
  </div>`;
  w.hidden = false;
  document.documentElement.style.overflow = "hidden"; stage.style.overflowY = document.body.dataset.device === "phone" ? "hidden" : "";
  const x = w.querySelector(".sh-x"); if (x) x.focus();
}

/* ---------- start: email + consent ---------- */
function renderStart(){
  const c = CONFIG.copy;
  const items = state.selected.map(s => { const h = habit(s);
    return `<li style="--cat:${CAT[h.cat]}"><span class="tile"><img src="${IMAGES[h.slug]}" alt=""></span><span class="nm">${esc(h.name)}<small>${esc(FREQ[freqOf(s)].label)}</small></span><button type="button" data-remove="${esc(s)}">Poista</button></li>`; }).join("");
  return `<div class="st">
    <div class="overline">${esc(c.startOverline)}</div>
    <h1>${esc(c.startH1)}</h1>
    <p class="lead">${esc(c.startLead)}</p>
    <ul class="chosen">${items}</ul>
    <button class="back" type="button" data-go="sivu">Muuta valintoja</button>
    <form id="form" novalidate>
      <label class="f" for="email">Sähköpostiosoite</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="nimi@esimerkki.fi">
      <p class="help">${esc(c.emailHelp)}</p>
      <label class="consent"><input id="consent" type="checkbox"><span>${esc(c.consent)}</span></label>
      <p class="err" id="err" role="alert"></p>
      <div class="actions">
        <button class="btn wide" type="submit" data-act="app">${esc(c.ctaApp)}</button>
        <button class="btn sec wide" type="submit" data-act="cal">${esc(c.ctaCal)}</button>
      </div>
    </form>
    <div class="ok" id="calok"></div>
    <p class="tiny">${esc(c.demoNote)}</p>
  </div>`;
}
function icsEscape(s){ return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
function fold(line){ const out = []; let s = line; while (s.length > 70) { out.push(s.slice(0, 70)); s = " " + s.slice(70); } out.push(s); return out.join("\r\n"); }
function buildICS(){
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const now = new Date();
  const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const first = new Date(); first.setDate(first.getDate() + 1);
  const last = new Date(first); last.setDate(last.getDate() + CONFIG.calendar.days - 1);
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Nanohabits//Tammikuun startti//FI", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
  state.selected.forEach((slug, i) => {
    const h = habit(slug), f = FREQ[freqOf(slug)];
    const start = new Date(first);
    while (f.days && !f.days.includes(start.getDay())) start.setDate(start.getDate() + 1);
    const rule = (f.byday ? "FREQ=WEEKLY;BYDAY=" + f.byday : "FREQ=DAILY") + ";UNTIL=" + ymd(last) + "T235959";
    const desc = h.sub + "\n\n" + f.label + " · " + CONFIG.calendar.footer;
    lines.push("BEGIN:VEVENT", "UID:startti-" + Date.now() + "-" + i + "@nanohabits.com", "DTSTAMP:" + stamp,
      "DTSTART:" + ymd(start) + "T" + CONFIG.calendar.time, "DURATION:PT10M", "RRULE:" + rule,
      "SUMMARY:" + icsEscape(CONFIG.calendar.prefix + h.name), "DESCRIPTION:" + icsEscape(desc),
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEscape(h.name), "TRIGGER:PT0M", "END:VALARM", "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.map(fold).join("\r\n") + "\r\n";
}
function downloadICS(){
  const ics = buildICS();
  try {
    const url = URL.createObjectURL(new Blob([ics], {type: "text/calendar;charset=utf-8"}));
    const a = document.createElement("a"); a.href = url; a.download = "tammikuun-startti.ics";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) {}
  const names = state.selected.map(s => `<li>${esc(habit(s).name)}: ${esc(FREQ[freqOf(s)].label.toLowerCase())}</li>`).join("");
  const ok = $("#calok");
  ok.innerHTML = `<b>Kalenterimuistutus on valmis.</b> Avaa ladattu tiedosto, niin muistutukset lisätään kalenteriisi ${CONFIG.calendar.days} päiväksi, klo 8.00.<ul>${names}</ul>`;
  ok.classList.add("on"); ok.scrollIntoView({behavior: "smooth", block: "nearest"});
}

/* ---------- simulated app ---------- */
function renderApp(){
  const p = CONFIG.partner, c = CONFIG.copy;
  const sel = state.selected.length ? state.selected : CONFIG.themes.slice(0, 3).map(t => t.habits[0].slug);
  const cards = sel.map(s => { const h = habit(s);
    return `<div class="hc"><span class="face" style="--cat:${CAT[h.cat]}"><span class="cpill">${esc(CATNAME[h.cat] || "")}</span><img src="${IMAGES[h.slug]}" alt=""></span><span class="nm">${hy(h.name)}</span><span class="fq">${esc(FREQ[freqOf(s)].label)}</span><span class="wk">${"MTKTPLS".split("").map(l => "<span>" + l + "</span>").join("")}</span><span class="dots">${[1, 2, 3, 4, 5, 6, 0].map(d => { const f = FREQ[freqOf(s)]; return !f.days || f.days.includes(d) ? '<i class="pl"></i>' : "<i></i>"; }).join("")}</span></div>`; }).join("");
  const d = new Date().toLocaleDateString("fi-FI", {weekday: "long", day: "numeric", month: "long"});
  return `<div class="appwrap"><div class="app">
    <span class="simtag">Simuloitu sovellusnäkymä</span>
    <div class="overline date">${esc(d)}</div>
    <h1>${esc(c.appH1)}</h1>
    <p style="color:var(--warm)">${esc(c.appLead)}</p>
    <div class="plus"><span class="dot"></span><span>${esc(p.plusLine)}</span></div>
    <div class="grid">${cards}</div>
    <div class="door"><img src="${IMAGES.library}" alt=""><div><div class="t">${esc(c.doorTitle)}</div><div class="d">${esc(c.doorText)}</div></div></div>
    <div class="note"><b>Demossa sovellus ei aukea.</b> ${esc(c.appNote)}</div>
    <button class="back" type="button" data-go="viesti-b">Aloita demo alusta</button>
  </div></div>`;
}

/* ---------- routing + device preview ---------- */
const VIEWS = CONFIG.views || ["viesti-a", "viesti-b", "sivu", "aloita", "sovellus"];
const START = CONFIG.start || "viesti-b";
document.querySelectorAll(".demobar nav button").forEach(b => { if (!VIEWS.includes(b.dataset.go)) b.remove(); });
const URLS = {"viesti-a": "Sähköposti · Saapuneet", "viesti-b": "Sähköposti · Saapuneet", "sivu": CONFIG.partner.url, "aloita": CONFIG.partner.url, "sovellus": "Nanohabits-sovellus puhelimessa (simuloitu)"};
function toTop(){ stage.scrollTop = 0; window.scrollTo(0, 0); }
function show(name){
  closeSheet();
  if (!VIEWS.includes(name)) name = START;
  if (name === "aloita" && state.selected.length === 0) name = "sivu";
  if (!VIEWS.includes(name)) name = START;
  state.view = name;
  const el = $("#v-" + name);
  el.innerHTML = name === "viesti-a" ? renderMail("a") : name === "viesti-b" ? renderMail("b")
    : name === "sivu" ? renderLanding() : name === "aloita" ? renderStart() : renderApp();
  VIEWS.forEach(v => $("#v-" + v).classList.toggle("on", v === name));
  document.querySelectorAll(".demobar nav button").forEach(b => b.dataset.go === name ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $("#url").textContent = URLS[name];
  toTop();
  if (name === "sivu" && state.focus != null) { const th = document.querySelectorAll(".theme")[state.focus]; state.focus = null; if (th) th.scrollIntoView({block: "start"}); }
  if (name === "sivu" && state.pending) { const pk = state.pending; state.pending = null; if (habit(pk)) openSheet(pk); } else state.pending = null;
}
function go(name){
  show(name);
  try { if (location.hash.slice(1) !== state.view) location.hash = state.view; } catch (e) {}
}
function setDevice(d){
  document.body.dataset.device = d;
  document.querySelectorAll(".devsw button").forEach(b => b.setAttribute("aria-pressed", b.dataset.device === d));
}
function fit(){
  const wide = window.innerWidth >= 900;
  document.body.dataset.wide = wide ? "1" : "0";
  setDevice(wide ? state.pref : "native");
}
window.addEventListener("resize", fit);
window.addEventListener("hashchange", () => { const n = location.hash.slice(1); if (n !== state.view) show(n); });
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (a) {
    e.preventDefault();
    if (a.dataset.theme != null) { state.focus = +a.dataset.theme; state.pending = a.dataset.pick || null; }
    go(a.getAttribute("href").slice(1));
    return;
  }
  const t = e.target.closest("[data-go],[data-slug],[data-remove],[data-order],.devsw [data-device],[data-open],[data-close],[data-more],[data-freq],[data-add],[data-end]");
  if (!t || t.disabled) return;
  if (t.dataset.end) { openEnd(); }
  else if (t.dataset.open) { openSheet(t.dataset.open); }
  else if (t.dataset.close) { closeSheet(); }
  else if (t.dataset.more) { $("#sh-desc").classList.remove("collapsed"); t.remove(); }
  else if (t.dataset.freq) { state.freq[state.open] = t.dataset.freq; document.querySelectorAll(".sh-freq button").forEach(b => b.setAttribute("aria-pressed", b.dataset.freq === t.dataset.freq)); }
  else if (t.dataset.add) { if (toggle(t.dataset.add)) closeSheet(); }
  else if (t.dataset.go) { go(t.dataset.go); }
  else if (t.dataset.slug) { toggle(t.dataset.slug); }
  else if (t.dataset.remove) { state.selected = state.selected.filter(s => s !== t.dataset.remove); if (state.selected.length) show("aloita"); else go("sivu"); }
  else if (t.dataset.order) { state.order = t.dataset.order; const y = [stage.scrollTop, window.scrollY]; show("sivu"); stage.scrollTop = y[0]; window.scrollTo(0, y[1]); }
  else if (t.dataset.device) { closeSheet(); state.pref = t.dataset.device; setDevice(state.pref); toTop(); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "form") return;
  e.preventDefault();
  const act = (e.submitter && e.submitter.dataset.act) || "app";
  const email = $("#email").value.trim(), err = $("#err");
  if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = "Kirjoita sähköpostiosoitteesi, niin voimme lähettää vahvistuksen."; $("#email").focus(); return; }
  if (!$("#consent").checked) { err.textContent = "Rastita hyväksyntä, niin pääset jatkamaan."; return; }
  err.textContent = "";
  if (act === "cal") downloadICS(); else go("sovellus");
});
fit();
show(location.hash.slice(1) || START);
</script>
</body>
</html>
